<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Refboard</title>
  <link rel="stylesheet" href="../lib/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">
      <img class="logo" src="../../icons/logo.svg" alt="">
      <div><b>Refboard</b><small>Save references · <span id="version"></span></small></div>
    </div>
    <button class="btn" id="open-board">Open board</button>
  </header>

  <section class="project">
    <label for="project">Active project</label>
    <select class="input" id="project"></select>
    <input class="input" id="new-project" placeholder="New project name, then Enter" hidden>
    <div class="folder" id="folder"></div>
  </section>

  <div class="actions">
    <button class="action primary" data-run="quick-screenshot"><span>Screenshot</span><small>Saves the visible screen instantly</small><kbd data-shortcut="quick-screenshot"></kbd></button>
    <button class="action" data-run="record-area"><span id="record-label">Record an area</span><small id="record-hint">Draw a box, record the animation</small><kbd data-shortcut="record-area"></kbd></button>
    <button class="action" data-run="start-picker"><span>Pick a section</span><small>Click an element or draw a box, add a note</small><kbd data-shortcut="start-picker"></kbd></button>
  </div>
  <p class="shortcut-help"><a href="#" id="set-shortcut">Change shortcuts</a></p>

  <div class="divider"><span>or save the whole page with a note</span></div>

  <form id="page-form">
    <textarea class="input" id="note" placeholder="What do you want to use from this page?"></textarea>
    <div class="chips" id="categories"></div>
    <input class="input" id="tags" placeholder="Tags, comma separated">
    <button class="btn" id="save-page" type="submit">Save whole page</button>
  </form>

  <p id="status" hidden></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
